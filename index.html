  <style>
    :root {
      /* ===== Base ===== */
      --base-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      --base-line-height: 1.6;
      --base-font-size: 16px;

      --cover-max-width: 48em;
      --content-max-width: 920px;

      /* ===== Dark Mode Colors (Deep Slate) ===== */
      --base-background-color: #161a27;
      --base-color: #cbd5e1;
      /* Text color mượt hơn */
      --heading-color: #f8fafc;
      --muted-color: #94a3b8;

      /* ===== Headings ===== */
      --heading-h1-font-size: 1.6rem;
      --heading-h2-font-size: 1.35rem;
      --heading-h1-font-weight: 600;

      /* ===== Links ===== */
      --link-color: #8f7ff5;
      --link-text-decoration: none;
      --link-text-decoration--hover: underline;

      /* ===== Sidebar & Navbar ===== */
      --sidebar-background: #11141f;
      --sidebar-border-color: #232838;
      --sidebar-name-color: #8f7ff5;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--active: #8f7ff5;

      /* ===== Search Plugin Fix ===== */
      --search-background: #11141f;
      --search-input-color: #f8fafc;
      --search-input-placeholder-color: #64748b;
      --search-result-heading-color: #8f7ff5;
      --search-result-keyword-background: rgba(143, 127, 245, 0.2);

      /* ===== Blockquote & Tabs ===== */
      --blockquote-border-color: #8f7ff5;
      --blockquote-background: rgba(143, 127, 245, 0.08);
      --docsifytabs-tab-background: #232838;
      --docsifytabs-tab-color: #94a3b8;
      --docsifytabs-tab-color--active: #8f7ff5;
    }

    /* ===== DARK MODE OVERRIDES ===== */
    body {
      background-color: var(--base-background-color);
      color: var(--base-color);
    }

    /* --- Fix Description & General Text --- */
    .markdown-section {
      color: var(--base-color);
    }

    .markdown-section strong {
      color: #f8fafc;
    }

    /* --- Search Plugin --- */
    .search input {
      background: var(--search-background) !important;
      color: var(--search-input-color) !important;
      border: 1px solid var(--sidebar-border-color) !important;
    }

    .search .search-keyword {
      color: #8f7ff5 !important;
      font-style: normal;
    }

    .search .clear-icon {
      background-color: transparent !important;
    }

    .search p.empty,
    .search .matching-post {
      color: var(--base-color) !important;
      background: var(--sidebar-background) !important;
      border-bottom: 1px solid var(--sidebar-border-color) !important;
    }

    /* --- Download Button --- */
    .download-container {
      margin-bottom: 2rem;
      display: flex;
      justify-content: flex-start;
    }

    .download-btn {
      background-color: #8f7ff5 !important;
      color: #ffffff !important;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      border: none;
    }

    .download-btn:hover {
      background-color: #7565e6 !important;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    /* --- Table Fix (For Package Includes) --- */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      background-color: #161a27 !important;
      color: var(--base-color) !important;
    }

    .markdown-section table tr {
      border-top: 1px solid #232838;
      background-color: #161a27 !important;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: #232838 !important;
    }

    .markdown-section table th,
    .markdown-section table td {
      padding: 12px 15px;
      border: 1px solid #343b52;
      color: var(--base-color) !important;
    }

    .markdown-section table th {
      background-color: #232838 !important;
      color: #8f7ff5 !important;
      font-weight: 700;
    }

    /* --- Code Blocks --- */
    code,
    pre {
      background-color: #11141f !important;
      color: #e5e7eb !important;
      border-radius: 6px;
    }

    pre {
      border: 1px solid #232838 !important;
    }

    /* --- Sidebar --- */
    .sidebar {
      background-color: var(--sidebar-background) !important;
      color: var(--base-color);
      border-right: 1px solid var(--sidebar-border-color);
    }

    .sidebar-nav li a {
      color: var(--sidebar-nav-link-color);
    }

    .sidebar-nav li.active>a {
      color: var(--sidebar-nav-link-color--active) !important;
      font-weight: bold;
    }

    /* ===== Search Box Container ===== */
    .sidebar .search {
      padding: 20px 16px 10px;
      background-color: transparent !important;
      border-bottom: 1px solid var(--sidebar-border-color);
    }

    /* ===== Input Wrap (Luna-style) ===== */
    .search .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: #161a27 !important;
      /* Màu nền nhẹ hơn sidebar một chút để tạo khối */
      border: 1px solid #343b52;
      /* Border sáng hơn để thấy rõ viền */
      border-radius: 10px;
      padding: 8px 12px 8px 38px;
      transition: all 0.2s ease-in-out;
    }

    /* Hiệu ứng khi click vào ô tìm kiếm */
    .search .input-wrap:focus-within {
      border-color: #8f7ff5;
      /* Màu xanh lá đặc trưng của bạn */
      box-shadow: 0 0 0 2px rgba(143, 127, 245, 0.15);
      background: #11141f !important;
      /* Đổi nền tối sâu hơn khi focus */
    }

    /* ===== Icon Tìm Kiếm (FontAwesome) ===== */
    .search .input-wrap::before {
      content: "\f002";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 14px;
      color: #64748b;
      /* Màu slate mờ */
      font-size: 13px;
      transition: color 0.2s;
    }

    .search .input-wrap:focus-within::before {
      color: #8f7ff5;
      /* Icon sáng lên khi focus */
    }

    /* ===== Ô Input thực tế ===== */
    .search input[type="search"] {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      width: 100%;
      color: #f8fafc;
      font-size: 14px;
      padding: 0 !important;
      margin: 0 !important;
    }

    .search input[type="search"]::placeholder {
      color: #64748b;
      opacity: 1;
    }

    /* ===== Phím tắt KBD (Luna-style) ===== */
    .search kbd {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      background: #232838;
      /* Nền phím tắt nổi bật trên nền tối */
      border: 1px solid #343b52;
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
      /* Tạo hiệu ứng phím vật lý */
      text-transform: uppercase;
      font-family: var(--base-font-family);
    }

    ::selection {
      background: #383838;
      /* nền đen */
      color: #ffffff;
    }

    ::-moz-selection {
      background: #000000;
      color: #ffffff;
    }

    /* ===== VFF PROFESSIONAL FOOTER ===== */

    .vff-footer {
      margin-top: 60px;
      padding: 50px 20px 30px;
      border-top: 1px solid #232838;
      background: #11141f;
    }

    .vff-footer-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
    }

    .vff-footer h3 {
      color: #8f7ff5;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .vff-footer h4 {
      color: #f8fafc;
      font-size: 14px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .vff-footer p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .vff-footer a {
      display: block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .vff-footer a:hover {
      color: #8f7ff5;
      transform: translateX(4px);
    }

    .vff-footer-bottom {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #232838;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .vg-free-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      border: 1px solid #46c08a;
      border-radius: 999px;
      background: #183e36;
      color: #a8efcd;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
    }
  </style>

<body>
  <div id="app"></div>
  <!-- Language routing (English at /, Vietnamese at /vi/) runs before Docsify renders -->
  <script src="assets/js/vinagen-lang.js"></script>
  <script src="assets/js/vinagen-fx.js"></script>
  <script>
    // Enter the URL of your own GitHub Repository in between the two quotes below
    var gitLinkRepoURL = 'https://github.com/hungwnguyen/Flowmind';

    // Set standalone to true to permanently hide the Sidebar and Navbar
    var standalone = false;

    // Set ToC to true to permanently show page Table of Contents (Sidebar and Navbar must also be hidden)
    var ToC = false;

    // Set navbar to true to permanently override the hiding of the Navbar when displaying as standalone
    var navbar = false;

    // Set footer to true to permanently show the Footer ('_footer.md)
    var footer = false;

    // Get value from GET-parameter in URL
    // @param {array} name Parameter-name
    // @param {*} isTrue Return if found
    // @param {*} isFalse Return if not found
    // @returns {string|null} Parameter-value
    function getURLParameterByName(name, isTrue = null, isFalse = null, url = window.location.href) {

      let exists = false;

      if (Array.isArray(name)) {

        name.forEach(element => {
          if (getURLParameterByName(element)) {
            exists = true;
          }
        });

      } else {

        name = name.toLowerCase().replace(/[\[\]]/g, '\\$&');

        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
        var results = regex.exec(url.toLowerCase());

        exists = (results && results[2]) ? true : false;
      }

      if (exists && isTrue) {
        return isTrue;
      }

      if (!exists && isFalse) {
        return isFalse;
      }

      return exists;
    }

    // Docsify
    window.$docsify = {
      // GENERAL SETTINGS
      // -----------------------------------------------------------------
      name: '<span class="vg-brand"><img src="images/robot.png" alt=""><span>VinaGen <small>AI Toolkit</small></span></span>',
      // repo           : 'https://github.com/hibbitts-design/docsify-open-publishing-starter-kit/',
      homepage: 'introduction.md',
      // Vietnamese pages live in vi/ with their own _sidebar.md and _footer.md
      relativePath: true,
      alias: {
        '/vi/': '/vi/introduction',
        '/vi/README': '/vi/introduction',
      },
      // coverpage      : '_coverpage.md',
      loadSidebar: !(getURLParameterByName(['standalone', 'embedded']) || standalone || false),

      mergeNavbar: false,
      externalLinkTarget: standalone ? '_top' : (getURLParameterByName(['standalone', 'embedded'], '_top', '_blank')),
      loadFooter: (getURLParameterByName('footer') || footer || true),

      // SIDEBAR NAVIGATION
      // -----------------------------------------------------------------
      auto2top: true,
      maxLevel: 3,
      // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
      subMaxLevel: 2,
      hideSidebar: (getURLParameterByName(['standalone', 'embedded']) || standalone),

      skipLink: (!(getURLParameterByName(['standalone', 'embedded']) && !(getURLParameterByName('toc'))) || standalone),

      // PLUGIN SETTINGS
      // -----------------------------------------------------------------
      search: {
        maxAge: 86400000, // Expiration time, the default one day
        paths: 'auto',
        placeholder: { '/vi/': 'Tìm kiếm Ctrl+K', '/': 'Search Ctrl+K' },
        noData: { '/vi/': 'Không tìm thấy kết quả.', '/': 'No matches found.' },
        pathNamespaces: ['/vi'],
        // Headline depth, 1 - 6
        depth: 3,
        namespace: 'vinagen-ai-toolkit-docs',
        hideOtherSidebarContent: false, // whether or not to hide other sidebar content
      },

      pagination: {
        previousText: 'PREV',
        nextText: 'NEXT',
        crossChapter: false,
        crossChapterText: false,
      },

      toc: {
        scope: '.markdown-section',
        headings: 'h2,h3',
        title: '',
      },

      // CUSTOM PLUGINS
      // -----------------------------------------------------------------
      plugins: [

        function (hook, vm) {

          hook.afterEach(function (html, next) {
            // Invoked each time after the Markdown file is parsed.
            // beforeEach and afterEach support asynchronous。
            // ...
            // call `next(html)` when task is done.

            var htmlElement = document.createElement('div');
            htmlElement.innerHTML = html;

            if (getURLParameterByName(['standalone', 'embedded']) || standalone) {

              // Carry any existing URL parms in links
              var URLparms = '';

              if (getURLParameterByName('standalone') || standalone) {
                URLparms = `?standalone=true`;
              }

              if (getURLParameterByName('embedded')) {
                URLparms = `?embedded=true`;
              }

              if (getURLParameterByName('hidegitlink')) {
                URLparms = URLparms + `&hidegitlink=true`;
              }

              if (getURLParameterByName('navbar') || navbar) {
                URLparms = URLparms + `&navbar=true`;
              }

              if (getURLParameterByName('toc') || ToC) {
                URLparms = URLparms + `&toc=true`;
              }

              if (getURLParameterByName('footer') || footer) {
                URLparms = URLparms + `&footer=true`;
              }

              const links = Array.from(htmlElement.querySelectorAll('a'))

              for (const link of links) {
                //console.log(link.getAttribute('href'));
                // Find any local Markdown file links not including Docsify id anchor links
                if ((link.getAttribute('href')?.match(/^#/) && (link.getAttribute('href').includes('id=')) === false)) {
                  // Modify each Markdown file link to include existing parms
                  var existingLink = link.getAttribute('href');
                  //console.log(existingLink);
                  // Update Markdown file link
                  var newURL = existingLink + URLparms;
                  //console.log("Changed:");
                  //console.log(newURL);
                  link.setAttribute('href', newURL);
                  //console.log(link.getAttribute('href'));
                }
              }
            }

            /* JS to change Embedly cards to light or dark theme based on system setting when using the light + dark theme (uncomment to use) */
            /*
            const embeds = Array.from(htmlElement.querySelectorAll('.embedly-card'))
            if (!(embeds.length === 0)) {
               if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)  {
                  // dark mode
                  // console.log("dark");
                  embeds.forEach(embed => {
                    embed.setAttribute('data-card-theme', 'dark');
                  });
                  } else {
                  // light mode
                  // console.log("light");
                  embeds.forEach(embed => {
                    embed.setAttribute('data-card-theme', 'light');
                  });
              }
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                // console.log(`changed to ${e.matches ? "dark" : "light"} mode`);
                // console.log(e.matches);            
                document.location.reload();
              });

            }
            */

            next(htmlElement.innerHTML);

          });

          // Invoked on each page load after new HTML has been appended to the DOM
          hook.doneEach(function () {

            // Compact navigation with recognizable tools and an optional page outline.
            var navIcons = {
              introduction: '<path d="m3 9 9-7 9 7v11H3Z"/><path d="M9 20v-7h6v7"/>',
              'getting-started': '<path d="m13 2-8 12h7l-1 8 8-12h-7Z"/>',
              graphs: '<rect x="2" y="3" width="7" height="5" rx="1"/><rect x="15" y="16" width="7" height="5" rx="1"/><path d="M5 8v10h10M9 5h9v11"/>',
              'web-editor': '<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20M6 5.5h1M10 5.5h1M7 12h10M7 16h6"/>',
              'ui-designer': '<path d="m12 2 10 6-10 6L2 8Zm-10 11 10 6 10-6M2 18l10 6 10-6"/>',
              'vinagen-text': '<path d="M3 7V3h18v4M12 3v18M8 21h8"/>',
              particles: '<path d="m12 3 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/><circle cx="20" cy="3" r="1"/><circle cx="3" cy="20" r="1"/>',
              'webgl-preview': '<rect x="2" y="3" width="20" height="15" rx="2"/><path d="m10 7 6 4-6 4ZM8 22h8M12 18v4"/>',
              'ai-chat': '<path d="M21 11a8 8 0 0 1-8 8H8l-5 3v-7a8 8 0 1 1 18-4Z"/><path d="M7 10h10M7 14h6"/>',
              'create-from-chat': '<path d="m3 21 12-12 3 3L6 24ZM18 2v4M16 4h4M6 3v4M4 5h4M20 16v4M18 18h4"/>',
              'mcp-bridge': '<rect x="8" y="2" width="8" height="6" rx="1"/><rect x="1" y="16" width="8" height="6" rx="1"/><rect x="15" y="16" width="8" height="6" rx="1"/><path d="M12 8v4H5v4M12 12h7v4"/>',
              settings: '<path d="M4 3v5M4 12v9M12 3v9M12 16v5M20 3v2M20 9v12"/><path d="M1 8h6M9 16h6M17 5h6"/>',
              'folder-layout': '<path d="M2 7V4h7l3 3h10v14H2Z"/>',
              faq: '<circle cx="12" cy="12" r="10"/><path d="M9 8a3 3 0 0 1 6 1c0 2-3 2-3 4M12 17h.01"/>'
            };
            document.querySelectorAll('.sidebar-nav > ul > li > ul > li > a').forEach(function (link) {
              if (link.querySelector('.vg-nav-icon')) return;
              var page = link.getAttribute('href').replace(/^#\//, '').replace(/^vi(?:\/|$)/, '').split('?')[0] || 'introduction';
              if (page === 'README') page = 'introduction';
              if (!navIcons[page]) return;
              link.insertAdjacentHTML('afterbegin', '<svg class="vg-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + navIcons[page] + '</svg>');
            });
            document.querySelectorAll('.sidebar-nav .app-sub-sidebar').forEach(function (list) {
              if (list.parentElement.classList.contains('vg-nav-toc')) return;
              var details = document.createElement('details');
              details.className = 'vg-nav-toc';
              var summary = document.createElement('summary');
              summary.textContent = /^#\/vi(?:\/|\?|$)/.test(location.hash) ? 'Trong trang này' : 'On this page';
              list.parentNode.insertBefore(details, list);
              details.appendChild(summary);
              details.appendChild(list);
            });

            // Short settle on each route change (disabled by prefers-reduced-motion in vinagen.css)
            var section = document.querySelector('.markdown-section');
            if (section) {
              section.classList.remove('vg-route-enter');
              void section.offsetWidth;
              section.classList.add('vg-route-enter');
            }
            // Aliased home routes (/vi/) have no sidebar match, leaving a bare "- Name" title
            if (/^\s*-\s/.test(document.title)) document.title = document.title.replace(/^\s*-\s*/, '');

            /* Javascript generated/assisted by Anthropic Claude AI */
            // Function to resolve image paths
            window.resolveImagePath = function (imagePath) {
              const basePath = vm.config.basePath || (window.location.pathname !== '/' ? '/' + window.location.pathname.split('/')[1] : '');
              const cleanImagePath = imagePath.startsWith('/') ? imagePath.slice(1) : imagePath;
              return basePath ? `${basePath}/${cleanImagePath}` : cleanImagePath;
            };
            // Auto-update all images with data-src attribute
            document.querySelectorAll('img[data-src]').forEach(img => {
              img.src = window.resolveImagePath(img.dataset.src);
            });

            var hasEmbedly = document.getElementsByClassName('embedly-card');
            if (hasEmbedly.length > 0) {
              // elements with class "embedly-card" exist
              var script = document.createElement('script');
              script.type = 'text/javascript';
              script.src = 'https://cdn.embedly.com/widgets/platform.js';
              document.head.appendChild(script);
            }

            // Remove optional ToC area if full width header image is present
            var hasImageHeader = document.getElementsByClassName('header-image-full-width');
            if (hasImageHeader.length > 0) {
              const elements = document.getElementsByClassName("nav");
              while (elements.length > 0) elements[0].remove();
            }

            // Adjust left margin for optional ToC area if faded header image is present
            var hasImageFade = document.getElementsByClassName('header-image-fade');
            var hasNav = document.getElementsByClassName('nav');
            if (hasImageFade.length > 0 && hasNav.length > 0) {
              var editCSS = document.createElement('style')
              editCSS.innerHTML = ".markdown-section {margin-right: 0px;}";
              document.body.appendChild(editCSS);
            }

            // Update all iframes with source domains 'youtube.com', 'youtube-nocookie.com', 'docs.google.com' or 'onedrive.live.com' to include the default responsive CSS Markdown class `video-container-16by9`
            const allIframes = Array.from(document.querySelectorAll('iframe[src*="youtube.com"], iframe[src*="youtube-nocookie.com"], iframe[src*="docs.google.com"], iframe[src*="onedrive.live.com"]'));

            // Filter out iframes that are not already wrapped with a div including the classes 'video-container-16by9' and 'video-container-4by3'
            const targetIframes = allIframes.filter(function (iframe) {
              const parentDiv = iframe.parentNode;
              return !parentDiv.matches('.video-container-16by9, .video-container-4by3');
            });

            // Wrap each target iframe with a div element
            targetIframes.forEach(function (iframe) {
              const wrapperDiv = document.createElement('div');
              wrapperDiv.classList.add('video-container-16by9');
              // Preserve existing classes on the iframe
              iframe.classList.forEach(function (className) {
                wrapperDiv.classList.add(className);
              });
              // Replace the iframe with the wrapper div
              iframe.parentNode.replaceChild(wrapperDiv, iframe);
              wrapperDiv.appendChild(iframe);
            });

          });

          hook.ready(function () {
            // Original code by @rizdaprasetya and further improved with the assistance of ChatGPT, an AI language model by OpenAI
            let TARGET_QUERY = 'id';
            let SCROLL_DELAY = 650; // in milliseconds
            let location = window.location;

            // Get topMargin from Docsify config or use default
            let topMargin = (window.$docsify && window.$docsify.topMargin) || 0;

            // Build the current URL without the hash
            let currentUrlWithoutHash = new URL(
              location.origin + location.pathname +
              location.search
            );

            // Get the search parameters from the URL (before the hash)
            let urlQueryParam = currentUrlWithoutHash.searchParams;
            let isUrlHasIdQuery = urlQueryParam.has(TARGET_QUERY);

            // Handle the case where the 'id' is in the fragment (hash) part
            let hashParams = new URLSearchParams(location.hash.split('?')[1]); // Get the query params after `#`
            let isHashHasIdQuery = hashParams.has(TARGET_QUERY);

            // Check if the URL contains the 'id' query parameter in either search or hash
            if (isUrlHasIdQuery || isHashHasIdQuery) {

              // Get the 'id' from either search or hash
              let urlId = isUrlHasIdQuery ? urlQueryParam.get(TARGET_QUERY) : hashParams.get(TARGET_QUERY);

              // Delay the scrolling to ensure everything is loaded
              setTimeout(function () {
                try {
                  let targetElement = document.querySelector('#' + urlId);
                  if (targetElement) {
                    // Calculate the scroll position with topMargin offset
                    let scrollTop = targetElement.offsetTop - topMargin;

                    // Ensure we don't scroll above the top of the page
                    scrollTop = Math.max(0, scrollTop);

                    // Scroll smoothly to the element's top position minus topMargin
                    window.scrollTo({
                      top: scrollTop,
                      behavior: 'smooth'
                    });
                  }
                } catch (e) {
                  console.log('custom scroll failed', e);
                }
              }, SCROLL_DELAY);
            }
          });

        }

      ]
    }
