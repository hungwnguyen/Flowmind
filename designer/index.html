<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Design UI locally in your browser. Import and export Photoshop files, SVGPRO, SVG and PNG without Unity."
    />
    <title>Flowmind · Web Designer</title>
    <link rel="icon" href="robot.png" />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="workspace-controls.css" />
    <link rel="stylesheet" href="standalone.css" />
    <script src="e-35I5WFY6.js"></script>
  </head>
  <body>
    <header class="topbar" aria-label="Document toolbar">
      <a
        class="brand"
        href="../#/vi/web-designer"
        title="Documentation"
        aria-label="Flowmind documentation"
        ><img src="robot.png" alt="" /><span>Flowmind</span></a
      >
      <span class="top-divider" aria-hidden="true"></span>
      <button
        id="workspace"
        class="workspace-picker icon-button"
        title="Choose a folder on this device"
        aria-label="Choose folder"
        data-icon="folder"
      >
        <span class="toolbar-label">Choose folder</span>
      </button>
      <button
        id="reconnect"
        class="icon-button"
        title="Reconnect folder"
        aria-label="Reconnect folder"
        data-icon="sync"
        hidden
      ></button>
      <button
        id="import-folder"
        class="icon-button folder-import"
        title="Import folder (read-only)"
        aria-label="Import folder"
        data-icon="upload"
      ></button>
      <span id="workspace-state" role="status">Loading local workspace…</span>
      <div
        id="document-tabs"
        class="document-tabs"
        role="tablist"
        aria-label="Open design document"
      ></div>
      <div class="top-actions">
        <button
          id="demo"
          class="icon-button"
          title="Open editable demo"
          aria-label="Demo"
          data-icon="demo"
        ></button>
        <button
          id="open-files"
          class="icon-button"
          title="Browse documents"
          aria-label="Files"
          data-icon="folder"
        ></button>
        <span class="top-divider" aria-hidden="true"></span>
        <button
          id="reload"
          class="icon-button"
          title="Reload saved document"
          aria-label="Reload"
          data-icon="reload"
        ></button>
        <button
          id="save"
          class="primary icon-button"
          title="Save · Ctrl/Cmd+S"
          aria-label="Save"
          data-icon="save"
        ></button>
        <button
          id="import"
          class="icon-button"
          title="Import PSD, SVGPRO, images or fonts"
          aria-label="Import"
          data-icon="download"
        ></button>
        <button
          id="export"
          class="icon-button"
          title="Export PSD, SVGPRO, SVG or PNG"
          aria-label="Export"
          data-icon="upload"
        ></button>
        <span class="top-divider" aria-hidden="true"></span>
        <button
          id="settings"
          class="icon-button"
          title="Settings"
          aria-label="Settings"
          data-icon="settings"
        ></button>
        <span id="sync-state" role="status"></span>
        <button
          id="toggle-layers"
          class="mobile-toggle icon-button"
          title="Toggle layers panel"
          aria-label="Layers"
          data-icon="sidebar"
        ></button>
        <button
          id="toggle-inspector"
          class="mobile-toggle icon-button"
          title="Toggle inspector"
          aria-label="Inspector"
          data-icon="properties"
        ></button>
      </div>
    </header>
    <main><p id="startup" role="status">Starting Web Designer…</p></main>
    <input id="folder-input" type="file" webkitdirectory multiple hidden />
    <dialog id="web-settings"></dialog>
    <script type="module" src="e-TN2VGXRC.mjs"></script>
  </body>
</html>
